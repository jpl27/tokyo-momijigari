<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tokyo in Colour</title>
<!-- Map engine, pinned to the same version as the Five Faces map (index.html). The only other things this page loads are map tiles. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css"
      integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"
        integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<style>
:root{
  --accent:#d2491f;
  --bar:#16181d; --bar-2:#23262d; --bar-text:#f3f3f1; --bar-dim:#a9adb5;
  --sheet:#ffffff; --ink:#15171a; --ink-dim:#555a62; --line:#dedfe2;
  --tap:44px;
  --peak:#c62828; --late:#ef8a17; --done:#8a8178; --fuji:#2f6db5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bar);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;max-width:100vw;overflow:hidden}
#stage{position:relative;flex:1 1 auto;min-height:0;background:#e9e7e2}
#map{position:absolute;inset:0}
#maperr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ink)}
[hidden]{display:none !important}
/* title card and the hand-edited colour check line */
#title{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;z-index:3;max-width:calc(100% - 76px);
  background:rgba(255,255,255,.95);border-radius:10px;padding:6px 10px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#title h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}
#title p{margin:0;font-size:13px;color:var(--ink-dim)}
#colourCheck{margin-top:5px;font-size:12.5px;line-height:1.3;color:#3d2f0c;background:#fff8e6;border:1px dashed #c9a24a;border-radius:6px;padding:3px 7px}
#colourCheck b{font-weight:700}
#notice{position:absolute;left:50%;transform:translateX(-50%);top:calc(96px + env(safe-area-inset-top));z-index:4;
  width:max-content;max-width:min(92%,420px);background:#fff8e6;border:1px solid #e3c98a;color:#3d2f0c;border-radius:10px;
  padding:8px 12px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer}
/* bottom bar */
#bar{flex:0 0 auto;background:var(--bar);color:var(--bar-text);padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 8px rgba(0,0,0,.3);z-index:5}
#attribSlot{font-size:11px;line-height:1.35;color:var(--bar-dim);padding:0 2px 4px;max-height:2.8em;overflow-y:auto}
#attribSlot .maplibregl-ctrl-attrib{background:none;padding:0;margin:0;float:none;font-size:11px}
#attribSlot .maplibregl-ctrl-attrib-inner, #attribSlot a{color:var(--bar-dim)}
#attribSlot .maplibregl-ctrl-attrib-button{display:none}
#regions{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:6px;margin:0 0 6px}
#tools{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
#bar button,#bar a.barlink{min-height:var(--tap);border:0;border-radius:8px;font:inherit;cursor:pointer;
  background:var(--bar-2);color:var(--bar-text);-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:2px 3px;min-width:0}
#regions button{font-size:14.5px;font-weight:700}
#regions button[aria-pressed="true"]{background:var(--accent);color:#fff}
#tools button,#tools a.barlink{font-size:13px;line-height:1.15;font-weight:600}
#tools button[aria-expanded="true"],#tools button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
#tools button[aria-pressed="true"]{background:#3a2a10;color:#ffd27a}
#bar a.barlink{text-decoration:none;background:#2c3340}
#bar button:focus-visible,#bar a:focus-visible,.sheet button:focus-visible,.sheet input:focus-visible,.sheet a:focus-visible{outline:3px solid #ffd27a;outline-offset:1px}
/* slide-up sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);color:var(--ink);
  max-height:66%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;border-radius:14px 14px 0 0;
  box-shadow:0 -4px 16px rgba(0,0,0,.3);padding:0 14px 14px}
@media (min-width:700px){.sheet{left:auto;right:12px;width:420px;bottom:12px;border-radius:14px;max-height:84%}}
.sheet header{position:sticky;top:0;background:var(--sheet);display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--line);z-index:1}
.sheet h2{font-size:17px;margin:0}
.sheet h3{font-size:15.5px;margin:16px 0 6px}
.sheet p{margin:6px 0;font-size:14.5px;color:#2a2d33}
.sheet .close{min-height:var(--tap);min-width:var(--tap);border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.opt{display:flex;align-items:flex-start;gap:10px;min-height:var(--tap);padding:8px 2px;border-bottom:1px solid #f0f0f2;cursor:pointer}
.opt input{width:22px;height:22px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.opt span{font-size:15px}
.opt small{display:block;color:var(--ink-dim);font-size:13px}
.wide{width:100%;min-height:var(--tap);border:1px solid #c9ccd1;border-radius:8px;background:#fff;font:inherit;font-size:14.5px;font-weight:600;color:#15171a;cursor:pointer;margin:8px 0}
.src{border-bottom:1px solid #f0f0f2;padding:8px 0;font-size:14px}
.src div{margin:2px 0}
.src .k{color:var(--ink-dim)}
.src a, .sheet a{color:#0b57a4;word-break:break-word}
ul.refs{margin:4px 0 8px;padding-left:18px;font-size:13.5px;color:#2a2d33}
ul.refs li{margin:4px 0;word-break:break-word}
ul.refs a{word-break:break-all}
details summary{cursor:pointer;min-height:40px;line-height:40px;font-weight:600;color:#15171a}
/* planner */
.verdict{border-left:5px solid var(--accent);background:#fbf3ef;padding:8px 11px;margin:10px 0;border-radius:0 8px 8px 0}
.verdict .k{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#7a2a10}
.verdict p{font-size:15px;color:#15171a;margin:4px 0}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin:8px 0 3px}
.wk .d{background:#f3f6fa;border:1px solid #d5dde8;border-radius:8px;padding:4px 2px 5px;text-align:center;min-width:0}
.wk .d.lake{background:#eaf1fb;border-color:#9fbbe0}
.wk .d b{display:block;font-size:13px}
.wk .where{display:block;font-size:10.5px;color:#4a4f57;line-height:1.15;min-height:2.3em}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.c{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;
  background:#15171a;color:#fff;font-size:11px;font-weight:700}
.c.arr{box-shadow:0 0 0 2px #2e9d4f}
.c.out{background:#fff;color:#15171a;border:2px solid #15171a}
.bands{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin:0 0 4px}
.band{border-radius:6px;font-size:11.5px;font-weight:700;padding:3px 4px;text-align:center;line-height:1.2}
.band.lk{background:#2f6db5;color:#fff}
.band.nrt{background:#15171a;color:#fff}
.wkkey{font-size:12.5px;color:#4a4f57;display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 0 8px}
.wkkey span{display:inline-flex;align-items:center;gap:5px}
.wkkey .c{width:15px;height:15px;font-size:9px}
.daylist{list-style:none;margin:0;padding:0}
.daylist li{display:grid;grid-template-columns:3.1em 1fr;gap:0 6px;padding:6px 0;border-bottom:1px solid #eceef0;font-size:14.5px;color:#15171a}
.daylist li b{font-size:14.5px}
.leg{border:1px solid #d5dde8;border-radius:10px;padding:4px 11px 8px;margin:10px 0;background:#fbfcfe}
.leg h4{margin:6px 0 2px;font-size:15.5px}
.leg .who{font-size:13px;color:#4a4f57;margin:0 0 4px}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;margin:6px 0;font-size:14.5px}
dl.facts dt{color:#444;font-weight:600}
dl.facts dd{margin:0;color:#111;min-width:0;overflow-wrap:anywhere}
.alt{font-size:14px;color:#2a2d33;margin:6px 0 0;padding-top:6px;border-top:1px dashed #d5dde8}
.warn{background:#fff6dc;border:1px solid #e0c36d;border-radius:8px;padding:7px 10px;font-size:14.5px;color:#2b2200;margin:8px 0}
.warn.hi{background:#ffe9e6;border-color:#d9776a;color:#3b0d06}
a.btnlink{display:inline-flex;align-items:center;min-height:var(--tap);padding:0 12px;border-radius:8px;background:#0b57a4;color:#fff !important;
  text-decoration:none;font-weight:600;font-size:14.5px;margin:4px 6px 0 0}
a.btnlink.sec{background:#e9eef6;color:#0b57a4 !important}
/* popups */
.maplibregl-popup-content{font-size:14.5px;line-height:1.4;padding:10px 30px 10px 12px;border-radius:10px;max-height:55vh;overflow-y:auto}
.maplibregl-popup-close-button{width:36px;height:36px;font-size:22px}
.pop h4{font-size:16px;margin:0 0 2px}
.pop .jp{margin:0 0 4px;color:#555;font-size:13.5px}
.pop p{margin:4px 0;color:#222}
.pop .stat{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;margin:2px 0 4px}
.pop .stat i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid #fff;box-shadow:0 0 0 1px #777}
.pop .stop{background:#fbf3ef;border-left:4px solid var(--accent);padding:5px 8px;margin:6px 0;border-radius:0 6px 6px 0;font-size:14.5px}
.pop .stop.dawn{background:#fdf0f6;border-left-color:#c2407e}
.pop .stop.sun{background:#fff3e2;border-left-color:#e07b00}
.pop .note{font-weight:600;color:#15171a}
.pop .conf{font-size:13.5px;color:#333;border-top:1px solid #eee;padding-top:5px;margin-top:6px}
.pop .approx{color:#7a4b00;font-weight:600}
.pop .flag{color:#a00000;font-weight:700}
.pop dl.facts{font-size:14px}
.pop a.btnlink{min-height:40px;font-size:14.5px}
/* markers: visible 30px, touch area 44px */
.pin{width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;border:0;padding:0}
.pin i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#15171a;color:#fff;border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font:700 12px/1 -apple-system,sans-serif}
.pin.sun i{background:#e07b00;width:34px;height:34px;font-size:17px}
.pin.dawn i{background:#c2407e;font-size:11px}
.lightlbl{pointer-events:none;background:#2b1d05;color:#ffd27a;font:700 12px/1.2 -apple-system,sans-serif;padding:3px 7px;border-radius:6px;
  white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.4);transform:translateY(-22px)}
.maplibregl-ctrl-group button{width:44px;height:44px}
.maplibregl-ctrl-top-right{top:env(safe-area-inset-top)}
/* map key: dockable left/right, folds to an edge tab (same pattern as the Five Faces map) */
#legend{position:absolute;left:calc(8px + env(safe-area-inset-left));bottom:40px;z-index:3;background:rgba(255,255,255,.96);border-radius:10px;padding:2px 9px 6px;
  box-shadow:0 1px 4px rgba(0,0,0,.3);max-width:min(56%,200px);font-size:12.5px;color:#15171a;overflow-y:auto;overscroll-behavior:contain}
#legend.dock-r{left:auto;right:calc(8px + env(safe-area-inset-right))}
#legendTop{display:flex;align-items:stretch;margin:0 -7px 0 -5px}
#legend.dock-r #legendTop{flex-direction:row-reverse;margin:0 -5px 0 -7px}
#legendHead{flex:1 1 auto;min-height:44px;display:flex;align-items:center;gap:5px;padding:0 4px;border:0;background:none;font:inherit;font-size:12px;font-weight:700;color:#555;cursor:pointer;text-align:left}
#legend.dock-r #legendHead{flex-direction:row-reverse;justify-content:flex-end}
#legendSide{flex:0 0 44px;min-height:44px;border:0;background:none;padding:0;font:inherit;font-size:18px;line-height:1;color:#555;cursor:pointer}
#legend .chev{display:inline-block;width:9px;height:9px;border:solid #555;border-width:0 0 2.5px 2.5px;transform:rotate(45deg);flex:0 0 auto}
#legend.dock-r #legendHead .chev{transform:rotate(-135deg)}
#legendTab{display:none}
#legend.folded{left:0;padding:0;max-width:none;border-radius:0 10px 10px 0;overflow:visible}
#legend.folded.dock-r{left:auto;right:0;border-radius:10px 0 0 10px}
#legend.folded #legendTop,#legend.folded #legendBody{display:none}
#legend.folded #legendTab{display:flex;align-items:center;gap:7px;min-height:44px;min-width:44px;border:0;background:none;cursor:pointer;
  font:inherit;font-size:13px;font-weight:700;color:#15171a;white-space:nowrap;padding:0 12px 0 calc(10px + env(safe-area-inset-left))}
#legend.folded.dock-r #legendTab{flex-direction:row-reverse;padding:0 calc(10px + env(safe-area-inset-right)) 0 12px}
#legend.folded #legendTab .chev{transform:rotate(-135deg)}
#legend.folded.dock-r #legendTab .chev{transform:rotate(45deg)}
#legend button:focus-visible{outline:3px solid #ffd27a;outline-offset:-3px}
#legendBody .lgt{font-weight:700;font-size:12.5px;margin:2px 0 1px}
#legendBody .lgr{display:flex;align-items:center;gap:6px;font-size:12px;margin:1px 0;white-space:nowrap}
#legendBody .lgr b{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px #888;display:inline-block;flex:0 0 auto}
#legendBody .lgr .ln{width:16px;height:0;border-top:3px solid var(--accent);display:inline-block;flex:0 0 auto}
#legendBody .lgr .mk{width:15px;height:15px;border-radius:50%;color:#fff;font:700 9px/15px sans-serif;text-align:center;display:inline-block;flex:0 0 auto}
#legendBody .lgs{font-size:11.5px;color:#444;white-space:normal;margin-top:3px}
#stage.busy #notice{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="map" role="region" aria-label="Map"></div>
    <div id="maperr"></div>
    <div id="title">
      <h1>Tokyo in Colour</h1>
      <p>Autumn leaves and the Fuji lakes</p>
      <div id="colourCheck" role="status"></div>
    </div>
    <div id="notice" role="status" hidden></div>

    <div id="legend" hidden><div id="legendTop"><button type="button" id="legendHead" aria-expanded="true" aria-label="Map key: fold to the edge"><span class="chev" aria-hidden="true"></span>Map key</button><button type="button" id="legendSide" aria-label="Move the map key to the right side"><span aria-hidden="true">&#8644;</span></button></div><div id="legendBody"></div><button type="button" id="legendTab" aria-expanded="false" aria-label="Open the map key"><span class="chev" aria-hidden="true"></span><span>Map key</span></button></div>

    <section class="sheet" id="sheet-planner" hidden aria-label="Planner">
      <header><h2>Planner</h2><button class="close" type="button">Close</button></header>
      <div id="plannerBody"></div>
    </section>

    <section class="sheet" id="sheet-layers" hidden aria-label="Layers">
      <header><h2>Layers</h2><button class="close" type="button">Close</button></header>
      <div id="layerBox"></div>
    </section>

    <section class="sheet" id="sheet-sources" hidden aria-label="Sources and rights">
      <header><h2>Sources and rights</h2><button class="close" type="button">Close</button></header>
      <p><strong>This map is for personal, non-commercial use.</strong> Every layer is credited as its owner asks.</p>
      <div id="srcBox"></div>
    </section>
  </div>

  <nav id="bar" aria-label="Map controls">
    <div id="attribSlot"></div>
    <div id="regions" role="group" aria-label="Choose a region">
      <button type="button" data-region="tokyo" aria-pressed="true">Tokyo</button>
      <button type="button" data-region="fuji" aria-pressed="false">Fuji Five Lakes</button>
      <button type="button" id="whereBtn">Where am I</button>
    </div>
    <div id="tools">
      <button type="button" data-sheet="planner" aria-expanded="false">Planner</button>
      <button type="button" id="lightsBtn" aria-pressed="false">Evening lights</button>
      <button type="button" data-sheet="layers" aria-expanded="false">Layers</button>
      <button type="button" data-sheet="sources" aria-expanded="false">Sources</button>
      <a class="barlink" href="index.html">Five Faces map</a>
      <a class="barlink" href="stats.html">Numbers</a>
    </div>
  </nav>
</div>

<script>
(function(){
'use strict';

/* ======================================================================
   COLOUR CHECK LINE: update by hand in the last days before the trip.
   Keep it public-safe: write a weekday ("Monday before"), never a calendar date.
   date: when you checked; text: what you found (e.g. "Rikugien and Ueno at peak, Gaien dropping").
   ====================================================================== */
const COLOUR_CHECK = { date: 'not yet checked', text: 'dot colours are the forecast from the research report' };

/* ---------- Status colours ---------- */
const STATUS = {
  peak: {label:'At peak', col:'#c62828', key:'At peak'},
  late: {label:'Late colour: go early in the week', col:'#ef8a17', key:'Late colour'},
  done: {label:'Finished', col:'#8a8178', key:'Finished'},
  fuji: {label:'Fuji view / no foliage', col:'#2f6db5', key:'Fuji view / no foliage'}
};
const RECHECK = 'Hours and fee follow the standard park schedule; the report says recheck them.';

/* ---------- Spots (from the Gemini report, read 2026-10-24). Positions: OpenStreetMap Nominatim; "≈" = approximate. ----------
   f = this year's forecast; il = light-up; h = hours; cl = closed; fee = admission; go = station or car park; cf = confidence */
const SPOTS = [
 /* --- Tokyo --- */
 {id:'rikugien', r:'t', n:'Rikugien Garden', jp:'六義園', lat:35.7334, lon:139.7463, s:'peak',
  tr:'Japanese maple (irohakaede), ginkgo, weeping cherry', pk:'Late Nov to mid Dec',
  f:'Nov 28 to Dec 11, peak Dec 3 (JMC). Weathernews ranks it 5th in Tokyo.',
  il:{d:'Nov 25 to Dec 6', h:'18:00–20:30 (last entry 19:30)', lbl:'18:00–20:30', now:true,
      t:'Lit maples on the island, a light show on the old storehouse, two tea houses. One-way path. It ends before you are back from the lake, so go Wed, Thu or Fri.',
      fee:'¥1,000 online in advance, ¥1,200 on the day (cash at the Main Gate). Numbers are capped each night.'},
  h:'Day 09:00–17:00 (last entry 16:30). The garden empties at 17:00 and reopens at 18:00 for the light-up.', cl:'None during the autumn event',
  fee:'¥300 (65+ ¥150). ¥400 day ticket with Kyū-Furukawa. Night ticket is separate.',
  go:'Komagome Sta. (JR Yamanote, Namboku Line), 5–7 min walk. Sengoku Sta. (Mita Line), 10 min.',
  cf:'High: own forecast, light-up dates confirmed.',
  links:[['Night tickets (Tokyo parks)', 'https://www.tokyo-park.or.jp/park/rikugien/news/2026/rikugiengardens.html']]},
 {id:'kyufurukawa', r:'t', n:'Kyū-Furukawa Gardens', jp:'旧古河庭園', lat:35.7425, lon:139.7462, s:'peak',
  tr:'Wax tree (haze), maples, ginkgo', pk:'Mid Nov to early Dec', f:'Nov 27 to Dec 9, peak Dec 2 (JMC).',
  h:'09:00–17:00 (last entry 16:30)', cl:'None in autumn', fee:'¥150 (65+ ¥70). ¥400 with Rikugien (day).',
  go:'Kami-Nakazato Sta. (JR Keihin-Tōhoku), Nishigahara Sta. (Namboku Line), or walk from Komagome.',
  note:'Pairs with Rikugien: come here at 15:00, then walk to the 18:00 light-up.', cf:'High: own forecast.'},
 {id:'koishikawa', r:'t', n:'Koishikawa Kōrakuen', jp:'小石川後楽園', lat:35.7054, lon:139.7492, s:'peak',
  tr:'Maple (irohamomiji), ginkgo, zelkova, cherry', pk:'Late Nov to early Dec',
  f:'Nov 27 to Dec 8, peak Dec 1 (JMC). Weathernews ranks it 9th.',
  h:'09:00–17:00 (last entry 16:30)', cl:'None in autumn', fee:'¥300', go:'Iidabashi Sta. or Kōrakuen Sta.',
  note:'Daytime autumn event; no night light-up.', cf:'High for colour. ' + RECHECK},
 {id:'hongo', r:'t', n:'University of Tokyo Hongō campus ginkgo avenue', jp:'東京大学本郷キャンパス銀杏並木', lat:35.7124, lon:139.7617, ax:true, s:'peak',
  tr:'Old ginkgo avenue from the Main Gate to Yasuda Auditorium; maples by Sanshirō Pond', pk:'Late Nov to early Dec',
  f:'No forecast of its own. The garden next door (Kyū-Iwasaki-tei): Nov 27 to Dec 7, peak Dec 1 (JMC).',

  return {type:'raster', tiles:['https://cyberjapandata.gsi.go.jp/xyz/' + id + '/{z}/{x}/{y}.' + ext],
          tileSize:256, maxzoom:maxz, attribution:ATTR.gsi};
}
const FADE = RM ? 0 : 250;
/* keep the dots clear of the title card (top) and the map key (bottom) */
function padFor(){
  var h = 0; try { h = $('stage').clientHeight; } catch (e) {}
  var top = 118, bottom = h > 560 ? 170 : 24;
  return {top:top, bottom:bottom, left:16, right:56};
}
let map;
try {
  map = new maplibregl.Map({
    container:'map',
    style:{version:8, sources:{'gsi-pale':gsi('pale', 'png', 18), 'gsi-relief':gsi('relief', 'png', 15), 'gsi-photo':gsi('seamlessphoto', 'jpg', 18)},
      layers:[
        {id:'paper', type:'background', paint:{'background-color':'#e9e7e2'}},
        {id:'pale', type:'raster', source:'gsi-pale', paint:{'raster-fade-duration':FADE}},
        {id:'photo', type:'raster', source:'gsi-photo', layout:{visibility:'none'}, paint:{'raster-fade-duration':FADE}},
        {id:'relief', type:'raster', source:'gsi-relief', layout:{visibility:'none'}, paint:{'raster-opacity':0.55, 'raster-fade-duration':FADE}}
      ]},
    bounds:REGION.tokyo, fitBoundsOptions:{padding:padFor('tokyo')},
    minZoom:7, maxZoom:18.5, maxBounds:[[137.9, 34.8], [140.6, 36.3]],
    attributionControl:false, dragRotate:false, pitchWithRotate:false
  });
} catch (err) {
  var me = $('maperr'); me.style.display = 'flex';
  me.textContent = 'This browser could not start the map (it needs WebGL). ' + err.message;
  return;
}
window.__map = map;
map.touchZoomRotate.disableRotation();
map.on('error', function(e){
  var id = e && (e.sourceId || (e.source && e.source.id));
  console.warn('[map] ' + (id ? id + ': ' : '') + ((e && e.error && e.error.message) || 'error'));
});
const attrib = new maplibregl.AttributionControl({compact:false});
map.addControl(attrib, 'bottom-right');
try { $('attribSlot').appendChild(attrib._container); } catch (e) {}
map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-right');
const geo = new maplibregl.GeolocateControl({
  positionOptions:{enableHighAccuracy:true, timeout:15000, maximumAge:10000},
  trackUserLocation:true, showAccuracyCircle:true
});
map.addControl(geo, 'top-right');
geo.on('error', function(){ showNotice('Your position is not available. Allow location for this page, then try again.'); });
$('whereBtn').addEventListener('click', function(){
  if (!('geolocation' in navigator)) { showNotice('This browser cannot share your position.'); return; }
  try { if (!geo.trigger()) showNotice('Location is starting. Tap again if nothing happens.'); } catch (e) { showNotice('Your position is not available.'); }
});

function setVis(id, on){ if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'); }
function dirUrl(s){ return 'https://www.google.com/maps/dir/?api=1&destination=' + s.lat + ',' + s.lon; }
function fit(b, pad){
  map.fitBounds(b, {padding:pad || padFor(), duration:RM ? 0 : 700, maxZoom:15});
}

/* ---------- Popups ---------- */
let curPopup = null;
function openPopup(ll, div){
  if (curPopup) curPopup.remove();
  curPopup = new maplibregl.Popup({offset:14, maxWidth:'300px', focusAfterOpen:false}).setLngLat(ll).setDOMContent(div).addTo(map);
  curPopup.on('close', function(){ setTimeout(layoutDock, 0); });
  setTimeout(layoutDock, 0);
  return curPopup;
}
function spotDiv(s, stop){
  var d = el('div', 'pop');
  d.appendChild(el('h4', null, s.n));
  if (s.jp) d.appendChild(el('p', 'jp', s.jp));
  var st = el('div', 'stat'); var dot = el('i'); dot.style.background = STATUS[s.s].col; st.appendChild(dot);
  st.appendChild(document.createTextNode(s.logi ? 'Start and end of the lake loop' : STATUS[s.s].label)); d.appendChild(st);
  if (stop) {
    var sp = el('div', 'stop' + (stop.code ? ' dawn' : '') + (stop.sun ? ' sun' : ''));
    sp.appendChild(el('b', null, (stop.code ? stop.code + ' · ' : 'Stop ' + stop.num + ' · ') + stop.t + (stop.sun ? ' · Sunset' : '') + (stop.code ? ' · Dawn' : '')));
    sp.appendChild(el('div', null, stop.w));
    d.appendChild(sp);
  }
  var dl = el('dl', 'facts');
  function row(k, v){ if (!v) return; dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, v)); }
  row('Trees', s.tr); row('Usual peak', s.pk); row('This year', s.f);
  if (s.il) row('Light-up', s.il.d + ', ' + s.il.h + '. ' + s.il.t + (s.il.fee ? ' Ticket: ' + s.il.fee : ''));
  row('Hours', s.h); row('Closed', s.cl); row('Entry', s.fee); row('Getting there', s.go);
  d.appendChild(dl);
  if (s.minor && !s.h) d.appendChild(el('p', null, 'The report names this place only as a forecast reference. No hours or fees given.'));
  if (s.note) d.appendChild(el('p', 'note', s.note));
  var c = el('p', 'conf'); c.appendChild(el('b', null, 'Report\'s confidence: ')); c.appendChild(document.createTextNode(s.cf || 'Not stated.'));
  if (/^Low/.test(s.cf || '')) c.firstChild.className = 'flag';
  d.appendChild(c);
  if (s.ax) d.appendChild(el('p', 'approx', '≈ Position is approximate.'));
  var lk = el('div');
  lk.appendChild(link(dirUrl(s), 'Directions', 'btnlink'));
  (s.links || []).forEach(function(x){ lk.appendChild(link(x[1], x[0], 'btnlink sec')); });
  d.appendChild(lk);
  return d;
}

/* ---------- Spot dots ---------- */
function spotFC(){
  return {type:'FeatureCollection', features:SPOTS.filter(function(s){ return !s.logi; }).map(function(s){
    return {type:'Feature', geometry:{type:'Point', coordinates:[s.lon, s.lat]},
            properties:{id:s.id, s:s.s, minor:s.minor ? 1 : 0, il:s.il ? 1 : 0}};
  })};
}
function spotFilter(){
  var f = ['all'];
  if (!state.minor) f.push(['==', ['get', 'minor'], 0]);
  if (lightsOn) f.push(['==', ['get', 'il'], 1]);
  return f.length > 1 ? f : null;
}
function addSpots(){
  map.addSource('spots', {type:'geojson', data:spotFC(), attribution:ATTR.osm});
  map.addSource('loop', {type:'geojson', data:{type:'FeatureCollection', features:[
    {type:'Feature', properties:{k:'sun'}, geometry:{type:'LineString', coordinates:LOOP.map(function(x){ return [BY[x.id].lon, BY[x.id].lat]; })}},
    {type:'Feature', properties:{k:'dawn'}, geometry:{type:'LineString', coordinates:DAWN.map(function(x){ return [BY[x.id].lon, BY[x.id].lat]; }).concat([[BY.kstation.lon, BY.kstation.lat]])}}
  ]}});
  map.addLayer({id:'loop-casing', type:'line', source:'loop', filter:['==', ['get', 'k'], 'sun'],
    layout:{'line-join':'round', 'line-cap':'round'}, paint:{'line-color':'#fff', 'line-width':6, 'line-opacity':0.9}});
  map.addLayer({id:'loop-line', type:'line', source:'loop', filter:['==', ['get', 'k'], 'sun'],
    layout:{'line-join':'round', 'line-cap':'round'}, paint:{'line-color':'#d2491f', 'line-width':3}});
  map.addLayer({id:'dawn-line', type:'line', source:'loop', filter:['==', ['get', 'k'], 'dawn'],
    layout:{'line-join':'round', 'line-cap':'round'}, paint:{'line-color':'#c2407e', 'line-width':3, 'line-dasharray':[1.5, 1.5]}});
  map.addLayer({id:'spots-dot', type:'circle', source:'spots',
    paint:{'circle-color':['match', ['get', 's'], 'peak', STATUS.peak.col, 'late', STATUS.late.col, 'done', STATUS.done.col, STATUS.fuji.col],
      'circle-radius':['interpolate', ['linear'], ['zoom'], 8, ['case', ['==', ['get', 'minor'], 1], 4, 5.5], 13, ['case', ['==', ['get', 'minor'], 1], 6.5, 9]],
      'circle-stroke-color':'#fff', 'circle-stroke-width':2}});
  map.addLayer({id:'spots-hit', type:'circle', source:'spots', paint:{'circle-radius':22, 'circle-opacity':0, 'circle-stroke-width':0}});
  applyLayers();
}
map.on('click', 'spots-hit', function(e){
  if (!e.features || !e.features.length) return;
  var best = e.features[0], bd = Infinity;
  e.features.forEach(function(f){
    var p = map.project(f.geometry.coordinates), dd = Math.pow(p.x - e.point.x, 2) + Math.pow(p.y - e.point.y, 2);
    if (dd < bd) { bd = dd; best = f; }
  });
  var s = BY[best.properties.id];
  openPopup([s.lon, s.lat], spotDiv(s));
});
map.on('mouseenter', 'spots-hit', function(){ map.getCanvas().style.cursor = 'pointer'; });
map.on('mouseleave', 'spots-hit', function(){ map.getCanvas().style.cursor = ''; });

/* ---------- Route pins (HTML markers, 44 px touch targets) ---------- */
const routeMarkers = [];
function pin(label, cls, s, stop, aria){
  var b = el('button', 'pin' + (cls ? ' ' + cls : '')); b.type = 'button'; b.setAttribute('aria-label', aria);
  var i = el('i', null, label); b.appendChild(i);
  b.addEventListener('click', function(ev){ ev.stopPropagation(); openPopup([s.lon, s.lat], spotDiv(s, stop)); });
  var m = new maplibregl.Marker({element:b}).setLngLat([s.lon, s.lat]);
  routeMarkers.push(m); return m;
}
LOOP.forEach(function(x, i){
  var s = BY[x.id]; x.num = i + 1;
  pin(x.sun ? '☀' : String(i + 1), x.sun ? 'sun' : null, s, x, 'Lake loop stop ' + (i + 1) + ': ' + s.n + (x.sun ? ', sunset' : ''));
});
DAWN.forEach(function(x){
  var s = BY[x.id], off = x.id === 'oishi' ? [0, -40] : [0, 0];
  var m = pin(x.code, 'dawn', s, x, 'Monday dawn ' + x.code + ': ' + s.n); m.setOffset(off);
});
function showRoute(on){ routeMarkers.forEach(function(m){ if (on) m.addTo(map); else m.remove(); }); setVis('loop-casing', on); setVis('loop-line', on); setVis('dawn-line', on); }

/* ---------- Evening lights ---------- */
const lightMarkers = SPOTS.filter(function(s){ return s.il; }).map(function(s){
  var d = el('div', 'lightlbl', s.n.replace(/ \(.*\)$/, '').replace(/ Garden$/, '') + ' · ' + s.il.lbl);
  return new maplibregl.Marker({element:d, anchor:'bottom'}).setLngLat([s.lon, s.lat]);
});
$('lightsBtn').addEventListener('click', function(){
  lightsOn = !lightsOn; this.setAttribute('aria-pressed', lightsOn ? 'true' : 'false');
  if (map.getLayer('spots-dot')) { map.setFilter('spots-dot', spotFilter()); map.setFilter('spots-hit', spotFilter()); }
  lightMarkers.forEach(function(m){ if (lightsOn) m.addTo(map); else m.remove(); });
  if (lightsOn) {
    if (!state.spots) { state.spots = true; save('ov', state); applyLayers(); buildLayers(); }
    showNotice('Only Rikugien has an evening light-up in your week: 18:00–20:30, Wed to Fri. Tap a dot for details.', 12000);
  } else $('notice').hidden = true;
});

/* ---------- Layers sheet ---------- */
function applyLayers(){
  setVis('relief', state.relief); setVis('photo', state.photo);
  setVis('spots-dot', state.spots); setVis('spots-hit', state.spots);
  if (map.getLayer('spots-dot')) { map.setFilter('spots-dot', spotFilter()); map.setFilter('spots-hit', spotFilter()); }
  showRoute(state.route);
}

  var box = $('layerBox'); box.textContent = '';

/* ---------- Sheets ---------- */
function closeSheets(){
  document.querySelectorAll('.sheet').forEach(function(s){ s.hidden = true; });

}

document.querySelectorAll('.sheet .close').forEach(function(b){ b.addEventListener('click', closeSheets); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheets(); });

const dock = Object.assign({side:'r', folded:false}, load('legendDock', {}));
let peek = false;
function openSheet(){ var s = null; document.querySelectorAll('.sheet').forEach(function(x){ if (!x.hidden) s = x; }); return s; }
function popupOpen(){ return !!document.querySelector('#map .maplibregl-popup'); }
function layoutDock(){
  var lg = $('legend'), stage = $('stage'), sh = openSheet(), busy = !!sh || popupOpen();
  if (!busy) peek = false;
  stage.classList.toggle('busy', busy);
  var folded = busy ? !peek : dock.folded, right = dock.side === 'r';
  lg.classList.toggle('folded', folded); lg.classList.toggle('dock-r', right);
  $('legendHead').setAttribute('aria-expanded', folded ? 'false' : 'true');
  $('legendTab').setAttribute('aria-expanded', folded ? 'false' : 'true');
  $('legendSide').setAttribute('aria-label', 'Move the map key to the ' + (right ? 'left' : 'right') + ' side');
  lg.style.bottom = ''; lg.style.maxHeight = '';
  if (lg.hidden) return;
  var sr = stage.getBoundingClientRect(), H = sr.height;
  function place(onRight){
    lg.classList.toggle('dock-r', onRight);
    var top = 8, ref = onRight ? document.querySelector('.maplibregl-ctrl-top-right') : $('title');
    if (ref) top = Math.max(top, ref.getBoundingClientRect().bottom - sr.top + 8);
    var nt = $('notice'); if (!nt.hidden) top = Math.max(top, nt.getBoundingClientRect().bottom - sr.top + 8);
    var bottom = 12;
    if (sh) { var r = sh.getBoundingClientRect(), l = lg.getBoundingClientRect();
      if (r.left < l.right && r.right > l.left) bottom = Math.max(bottom, Math.round(sr.bottom - r.top) + 8); }
    return {top:top, bottom:bottom, room:H - top - bottom};
  }
  var g = place(right);
  if (g.room < 44 && right && busy) { var g2 = place(false); g = g2.room >= 44 ? g2 : place(true); }
  var bottom = g.room < 44 ? Math.max(8, Math.round(H - g.top - 44)) : g.bottom;
  lg.style.bottom = bottom + 'px';
  if (!folded) lg.style.maxHeight = Math.max(44, Math.round(H - g.top - bottom)) + 'px';
}
function setFold(f){
  if (openSheet() || popupOpen()) peek = !f; else { dock.folded = f; save('legendDock', dock); }
  layoutDock();
  try { $(f ? 'legendTab' : 'legendHead').focus({preventScroll:true}); } catch (e) {}
}
$('legendHead').addEventListener('click', function(){ setFold(true); });
$('legendTab').addEventListener('click', function(){ setFold(false); });
$('legendSide').addEventListener('click', function(){ dock.side = dock.side === 'r' ? 'l' : 'r'; save('legendDock', dock); layoutDock(); });
try {
  var obs = new MutationObserver(function(){ layoutDock(); });
  document.querySelectorAll('.sheet').forEach(function(s){ obs.observe(s, {attributes:true, attributeFilter:['hidden']}); });
  obs.observe($('notice'), {attributes:true, attributeFilter:['hidden']});
  if (window.ResizeObserver) { var ro = new ResizeObserver(function(){ layoutDock(); }); ro.observe($('stage')); }
} catch (e) { console.warn('[map] key docking observers not started', e); }
window.addEventListener('resize', layoutDock);
layoutDock();
